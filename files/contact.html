<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Hernán Salinas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #0a0a12;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .contact-box {
            background: white;
            color: #2d3436;
            padding: 50px;
            border-radius: 24px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
        }
        h2 { border-left: 5px solid #ff9f43; padding-left: 15px; color: #1a2a3a; margin-top: 0; }
        .info-item { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; font-size: 1.1rem; }
        .info-item i { color: #ff9f43; font-size: 1.5rem; width: 30px; text-align: center; }
        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1a2a3a;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-btn:hover { color: #ff9f43; }
    </style>
</head>
<body>
    
    <div class="contact-box">
        <h2>CONTACT ME</h2>
        <p><strong>Hernán Salinas Castro </strong></p> 
        <p> PhD Student n Astrophysics</p>
        <div class="info-item">
            <i class="fas fa-envelope"></i>
            <span>hsalinasc@estudiante.uc.cl</span>
        </div>

        <h2>Office Info</h2>
        <div class="info-item">
            <i class="fas fa-building"></i>
            <span>Astrophysics Institute Faculty of Physics, PUC Chile</span>
        </div>
        <div class="info-item">
            <i class="fas fa-door-open"></i>
            <span>Office: 118 (San Joaquín Campus)</span>
        </div>
        <div class="info-item">
            <i class="fas fa-map-marker-alt"></i>
            <span>Av. Vicuña Mackenna 4860, Santiago Chile</span>
        </div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">
        <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
</body>
</html>
