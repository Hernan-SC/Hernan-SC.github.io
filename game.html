<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planetary Defense | Hernán Salinas</title>
    <style>
        body { margin: 0; background: #050005; color: white; font-family: 'Inter', sans-serif; text-align: center; overflow: hidden; }
        
        /* Borde Morado Neón */
        canvas { 
            display: block; 
            background: #000; 
            margin: 10px auto; 
            border: 2px solid #bc13fe; 
            border-radius: 15px; 
            cursor: crosshair;
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.4);
        }

        .ui { max-width: 500px; margin: 0 auto; }
        
        .leaderboard { 
            background: rgba(188, 19, 254, 0.05); 
            padding: 15px; 
            border-radius: 12px; 
            margin-top: 10px; 
            border: 1px solid rgba(188, 19, 254, 0.3); 
        }

        h1 { margin-top: 15px; color: #bc13fe; letter-spacing: 4px; text-shadow: 0 0 15px #bc13fe; }
        
        .back-link { 
            color: #d870ff; 
            text-decoration: none; 
            font-size: 0.9rem; 
            opacity: 0.7; 
            transition: 0.3s; 
            padding: 10px; 
            display: inline-block; 
        }
        .back-link:hover { opacity: 1; text-shadow: 0 0 10px #bc13fe; }
        
        #highscores { line-height: 1.6; font-family: monospace; font-size: 1.1rem; color: #eec9ff; }
    </style>
</head>
<body>

    <h1>PLANETARY DEFENSE</h1>
    <p style="color: #888;">Move Earth to dodge Comets and Giant Planets</p>
    <canvas id="gameCanvas" width="500" height="600"></canvas>

    <div class="ui">
        <div class="leaderboard">
            <strong style="color: #bc13fe;">TOP 3 SURVIVORS</strong>
            <div id="highscores">Loading scores...</div>
        </div>
        <br>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('highscores');

        const images = {
            earth: { src: 'images/game/tl.png', loaded: false, obj: new Image(), color: '#00d4ff' },
            comet: { src: 'images/game/meto.png', loaded: false, obj: new Image(), color: '#ff4d4d' },
            planet: { src: 'images/game/gas.png', loaded: false, obj: new Image(), color: '#ff9f43' }
        };

        Object.values(images).forEach(imgData => {
            imgData.obj.onload = () => { imgData.loaded = true; };
            imgData.obj.src = imgData.src;
        });

        let player = { x: 250, y: 550, size: 22 };
        let obstacles = [];
        let score = 0;
        let gameActive = false; 
        let lastTime = Date.now();

        // Estrellas animadas
        let stars = [];
        for(let i=0; i<80; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2,
                speed: Math.random() * 0.6 + 0.1
            });
        }

        let highscores = JSON.parse(localStorage.getItem('astroScoresV2')) || [
            {name: "---", pts: 0}, {name: "---", pts: 0}, {name: "---", pts: 0}
        ];

        function updateLeaderboard() {
            scoreElement.innerHTML = highscores
                .map((entry, i) => `<br>${i+1}. ${entry.name.toUpperCase()} - ${entry.pts} pts`)
                .join('');
        }

        function saveScore(finalScore) {
            let userName = prompt("GAME OVER!\nScore: " + finalScore + "\n\nEnter your initials (3 letters):", "AAA");
            if (!userName) userName = "UNK";
            userName = userName.substring(0, 3).toUpperCase();
            highscores.push({ name: userName, pts: finalScore });
            highscores.sort((a, b) => b.pts - a.pts);
            highscores = highscores.slice(0, 3);
            localStorage.setItem('astroScoresV2', JSON.stringify(highscores));
            updateLeaderboard();
            resetGame();
        }

        function resetGame() {
            obstacles = [];
            score = 0;
            gameActive = false;
            player = { x: 250, y: 550, size: 22 }; 
            draw(); 
        }

        canvas.addEventListener('mousedown', () => {
            if (!gameActive) {
                gameActive = true;
                lastTime = Date.now();
                update();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
            player.y = e.clientY - rect.top;
        });

        function createObstacle() {
            const isPlanet = Math.random() < 0.25;
            obstacles.push({
                x: Math.random() * canvas.width,
                y: -60,
                size: isPlanet ? 45 : 15,
                speed: isPlanet ? 1.5 + Math.random() : 3 + Math.random() * 3,
                type: isPlanet ? 'planet' : 'comet',
                angle: 0,
                rotSpeed: (Math.random() - 0.5) * 0.05
            });
        }

        function update() {
            if (!gameActive) return;

            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) star.y = 0;
            });

            let now = Date.now();
            if (now - lastTime >= 1000) { score += 1; lastTime = now; }
            if (Math.random() < 0.06) createObstacle();

            obstacles.forEach((obs, index) => {
                obs.y += obs.speed;
                obs.angle += obs.rotSpeed;

                let dx = player.x - obs.x;
                let dy = player.y - obs.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < (player.size * 0.7) + (obs.size * 0.7)) {
                    gameActive = false;
                    setTimeout(() => saveScore(score), 100);
                    return;
                }
                if (obs.y > canvas.height + 100) obstacles.splice(index, 1);
            });

            draw();
            if (gameActive) requestAnimationFrame(update);
        }

        function draw() {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Estrellas
            ctx.fillStyle = "white";
            stars.forEach(star => {
                ctx.globalAlpha = star.speed;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;

            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x, obs.y);
                ctx.rotate(obs.angle);
                const imgData = obs.type === 'planet' ? images.planet : images.comet;
                if (imgData.loaded) {
                    ctx.drawImage(imgData.obj, -obs.size, -obs.size, obs.size*2, obs.size*2);
                } else {
                    ctx.beginPath(); ctx.arc(0, 0, obs.size, 0, Math.PI*2);
                    ctx.fillStyle = imgData.color; ctx.fill();
                }
                ctx.restore();
            });

            // JUGADOR CON NEÓN CELESTE (Original)
            ctx.save();
            if (images.earth.loaded) {
                ctx.shadowBlur = 20; 
                ctx.shadowColor = "#00d4ff"; 
                ctx.drawImage(images.earth.obj, player.x - player.size, player.y - player.size, player.size*2, player.size*2);
            } else {
                ctx.beginPath(); ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
                ctx.fillStyle = "#00d4ff"; ctx.fill();
            }
            ctx.restore();

            // Puntos con color Morado
            ctx.fillStyle = "#bc13fe";
            ctx.font = "bold 20px Inter";
            ctx.textAlign = "left";
            ctx.fillText("SCORE: " + score, 20, 40);

            if (!gameActive) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.fillStyle = "#bc13fe";
                ctx.textAlign = "center";
                ctx.font = "bold 28px Inter";
                ctx.shadowBlur = 15; ctx.shadowColor = "#bc13fe";
                ctx.fillText("INSERT COIN", canvas.width/2, canvas.height/2 - 20);
                
                ctx.shadowBlur = 0;
                ctx.font = "16px Inter";
                ctx.fillStyle = "white";
                ctx.fillText("CLICK TO START DEFENSE", canvas.width/2, canvas.height/2 + 20);
            }
        }

        updateLeaderboard();
        draw();
    </script>
</body>
</html>
