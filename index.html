<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre Apellido | Perfil Científico</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

        :root {
            --primary: #1a2a3a; /* Azul oscuro profundo */
            --accent: #00d4ff;  /* Cian brillante para detalles */
            --text: #2d3436;
            --bg-light: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: var(--text);
            /* IMAGEN DE FONDO */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1532094349884-543bc11b234d?auto=format&fit=crop&q=80&w=2070'); 
            background-attachment: fixed;
            background-size: cover;
            background-position: center;
        }

        header {
            padding: 80px 20px;
            text-align: center;
            color: white;
        }

        header h1 { 
            margin: 0; 
            font-size: 3rem; 
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        header p { 
            font-size: 1.4rem; 
            font-weight: 300;
            margin-top: 10px;
            opacity: 0.9;
        }

        .container {
            max-width: 850px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        section {
            background: var(--bg-light);
            padding: 40px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px); /* Efecto cristal esmerilado */
        }

        h3 {
            color: var(--primary);
            font-size: 1.5rem;
            border-left: 5px solid var(--accent);
            padding-left: 15px;
            margin-top: 0;
        }

        .pub-list {
            list-style: none;
            padding: 0;
        }

        .pub-item {
            background: #f1f7ff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: transform 0.2s;
        }

        .pub-item:hover {
            transform: translateX(10px);
            background: #e6f0ff;
        }

        .contact-btn {
            display: inline-block;
            background: var(--primary);
            color: white !important;
            padding: 12px 25px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 10px;
        }

        .social-links {
            margin-top: 25px;
        }

        .social-links a {
            color: white;
            font-size: 2rem;
            margin: 0 15px;
            transition: color 0.3s;
        }

        .social-links a:hover {
            color: var(--accent);
        }
